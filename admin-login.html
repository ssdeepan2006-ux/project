<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | KADALARASAN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page" data-role="admin">
  <main class="auth-card">
    <a class="navbar-brand auth-brand" href="/">♛ KADALARASAN</a>
    <p class="gold mt-4 mb-2">STAFF ACCESS</p>
    <h1>Admin Login</h1>
    <p>Sign in with the administrator credentials.</p>

    <form id="authForm">
      <label class="form-label" for="username">Admin username</label>
      <input class="form-control mb-3" id="username" name="username"
        autocomplete="username" required>

      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" id="password" name="password"
        type="password" autocomplete="current-password" required>

      <button class="btn btn-warning w-100" id="submitButton" type="submit">
        Sign In as Admin
      </button>
    </form>

    <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
    <button class="btn btn-outline-secondary w-100" id="logoutButton" type="button" hidden>
      Sign Out
    </button>
    <a class="auth-back" href="/">Back to seafood shop</a>
    <a class="auth-admin-link" href="/login">Customer login</a>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
