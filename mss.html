<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dress Collection</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-5">
            Dress Collection
        </h1>

        <div class="row g-4">

            <!-- Dress Card 1 -->
            <div class="col-lg-4 col-md-6">

                <div class="card shadow-sm h-100">

                    <img
                        src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=800&q=80"
                        class="card-img-top"
                        alt="Elegant Dress">

                    <div class="card-body">

                        <h4 class="card-title">
                            Elegant Black Dress
                        </h4>

                        <p class="card-text text-muted">
                            Stylish party wear dress
                        </p>

                        <p class="mb-2">
                            <strong>Size:</strong>
                            S, M, L, XL
                        </p>

                        <p class="mb-3">
                            <strong>Price:</strong> ₹1,499
                        </p>

                        <button class="btn btn-dark w-100">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>
