a<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hamburger{
    display: none;
}
.mobile-menu{
    display: none;
}
@media (max-width:768px){
    .hamburger{
        display: block;
        background-color: brown;
        color: #fff;
        border: none;
        padding: 10px 16px;
        font-size: 16px;
        
        cursor: pointer;
    }
    .mobile-menu{
        display: block;

        background-color: #fff;
    
        padding: 10px;
    }
    .navbar{
        position: sticky;
        top: 0;
        background-color: green;
        color: #fff;
        padding: 14px 24px;
        z-index: 1000;
    }
    
    </style>
    
</head>
<body>
    <nav class="desktop-nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <button class="hamburger">&#9776;menu</button>
    <div class="mobile-menu" id="mobileMenu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</body>
</html>
